name: Build WASM Library

on:
  push:
    branches: [main]
  pull_request_target:

jobs:
  wasm-build:
    runs-on: docker
    container: git.indigocode.dev/sessamekesh/emsdk-clang-box:0.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore dependency build cache
        id: deps-cache
        uses: actions/cache@v3
        with:
          path: |
            build/linux-clang-release/_deps
            build/linux-clang-release/wrangle-tools.cmake
            build/emscripten-release/_deps
          key: wasm-deps-${{ runner.os }}-${{ hashFiles('extern/CMakeLists.txt', 'cmake/import_build_tools.cmake') }}
          restore-keys: |
            wasm-deps-${{ runner.os }}-

      # flatc cannot (and should not) be built under Emscripten, so build it
      # natively first. Configuring the native preset runs export_build_tools.cmake,
      # which writes build/linux-clang-release/wrangle-tools.cmake; the Emscripten
      # build below auto-discovers flatc from that native preset's build dir.
      #
      # On an exact cache hit both wrangle-tools.cmake and the flatc binary inside
      # _deps/flatbuffers-build/ are restored, so these two steps can be skipped.
      # On a partial hit (restore-keys match) the native steps still run to ensure
      # wrangle-tools.cmake and the binary are coherent with the current sources.
      - name: Configure native (Linux clang) for flatc
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: cmake --preset linux-clang-release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build flatc
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: cmake --build --preset linux-clang-release --target flatc

      - name: Configure Emscripten (release)
        run: cmake --preset emscripten-release ${{ steps.deps-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '-DFETCHCONTENT_UPDATES_DISCONNECTED=ON' }}

      - name: Build igasset WASM library
        run: cmake --build --preset emscripten-release --target igasset
