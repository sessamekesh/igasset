name: igasset-gen Integration Tests

on:
  push:
    branches: [main]
  pull_request_target:

jobs:
  build-and-test:
    runs-on: docker
    container: git.indigocode.dev/sessamekesh/emsdk-clang-box:0.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore dependency build cache
        id: deps-cache
        uses: actions/cache@v3
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('extern/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DIGASYNC_BUILD_TESTS=OFF
          -DIGASYNC_BUILD_EXAMPLES=OFF
          ${{ steps.deps-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '-DFETCHCONTENT_UPDATES_DISCONNECTED=ON' }}

      - name: Build
        run: >
          cmake --build build
          --target igasset-gen
          --target enumerate-igasset
          --target igpack-bundle
          --target enumerate-igpack
          --target extract-asset-metadata
          --target staged-asset-io-selftest
          --target igasset-selftest

      - name: Run staged-asset-io selftest
        run: build/tools/staged-asset-io/staged-asset-io-selftest

      - name: Run igasset decoder selftest
        run: build/igasset/igasset-selftest

      - name: Run igasset-gen Integration Tests
        env:
          IGASSET_GEN_BIN: build/tools/igasset-gen/igasset-gen
          ENUMERATE_IGASSET_BIN: build/tools/enumerate-igasset/enumerate-igasset
        run: pytest tools/igasset-gen/e2e/ -v

      - name: Run igpack-bundle Integration Tests
        env:
          IGASSET_GEN_BIN: build/tools/igasset-gen/igasset-gen
          IGPACK_BUNDLE_BIN: build/tools/igpack-bundle/igpack-bundle
          ENUMERATE_IGPACK_BIN: build/tools/enumerate-igpack/enumerate-igpack
        run: pytest tools/igpack-bundle/e2e/ -v

      - name: Run extract-asset-metadata Integration Tests
        env:
          EXTRACT_ASSET_METADATA_BIN: build/tools/extract-asset-metadata/extract-asset-metadata
        run: pytest tools/extract-asset-metadata/e2e/ -v
